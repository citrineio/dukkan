name: CI

on:
  push:
  pull_request:

jobs:
  build-and-static-tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install Qt build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake g++ ninja-build qt6-base-dev qt6-declarative-dev libsdl2-dev \
            qml6-module-qtquick qml6-module-qtquick-window qml6-module-qtquick-controls \
            qml6-module-qtquick-templates qml6-module-qtquick-layouts qml6-module-qtqml-workerscript \
            qml6-module-qtqml
      - name: Source/contract tests
        run: python3 -m unittest discover -s tests -v
      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Debug
      - name: Compile
        run: cmake --build build -j2
      - name: Controller and keyboard behavior
        run: |
          node tests/keyboard-views.cjs
          node tests/gallery-flow.cjs
      - name: Metadata and full QML runtime tests
        env:
          UI_CAPTURE_DIR: ${{ github.workspace }}/ui-captures
        run: ctest --test-dir build --output-on-failure
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gallery-ui-captures
          path: ui-captures/*.png
          if-no-files-found: ignore
